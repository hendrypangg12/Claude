name: Beruang Finance (auto-post)

# Generate 1 konten Beruang Finance (tips/berita/lucu) → carousel + reel berlagu.
# Auto-post ke IG @beruangfinance (pakai secret IG_USER_ID_BF / IG_ACCESS_TOKEN_BF).
# Jadwal SENGAJA beda jam dari faktaviral biar gak nabrakan.

on:
  schedule:
    # WIB = UTC+7. 5 slot/hari, jam beda dari Daily Fakta. Menit :17 (hindari jam bulat).
    - cron: "17 0 * * *"   # 07:17 WIB → REEL
    - cron: "17 4 * * *"   # 11:17 WIB → carousel
    - cron: "17 8 * * *"   # 15:17 WIB → carousel
    - cron: "17 11 * * *"  # 18:17 WIB → REEL
    - cron: "17 14 * * *"  # 21:17 WIB → carousel
  workflow_dispatch:
    inputs:
      ctype:
        description: "Jenis konten (kosong = Claude pilih)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - tips
          - berita
          - lucu
      topic:
        description: "Topik spesifik (opsional, mis. 'dana darurat')"
        required: false
        default: ""
        type: string
      post_mode:
        description: "Mau post apa?"
        required: false
        default: "carousel"
        type: choice
        options:
          - carousel
          - reel
          - both
          - none

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: beruang-finance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fakta-poster/requirements.txt

      - run: pip install -r ../fakta-poster/requirements.txt

      - name: Install ffmpeg (untuk reel)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Resolve slot (jenis + mode) untuk run ini
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "17 0 * * *")  ct="tips";   mode="reel" ;;      # 07:17 WIB
            "17 4 * * *")  ct="berita"; mode="carousel" ;;  # 11:17 WIB
            "17 8 * * *")  ct="tips";   mode="carousel" ;;  # 15:17 WIB
            "17 11 * * *") ct="lucu";   mode="reel" ;;      # 18:17 WIB
            "17 14 * * *") ct="berita"; mode="carousel" ;;  # 21:17 WIB
            *)            ct="${{ github.event.inputs.ctype }}"; mode="" ;;  # manual
          esac
          echo "ct=$ct"     >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - run: python bf_daily.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CTYPE: ${{ steps.slot.outputs.ct }}
          TOPIC: ${{ github.event.inputs.topic }}

      - name: Siapkan media + commit
        if: ${{ github.event.inputs.post_mode != 'none' }}
        working-directory: ${{ github.workspace }}
        run: |
          TS=$(ls -t beruang-finance/out | head -1)
          echo "TS=$TS" >> "$GITHUB_ENV"
          mkdir -p "beruang-finance/published/$TS"
          cp beruang-finance/out/$TS/post_*.jpg "beruang-finance/published/$TS/" 2>/dev/null || true
          REEL="beruang-finance/out/$TS/reel.mp4"
          if [ -f "$REEL" ] && [ "$(stat -c%s "$REEL")" -lt 99000000 ]; then
            cp "$REEL" "beruang-finance/published/$TS/"
          else
            echo "reel skip (kegedean/ga ada)"
          fi
          cp beruang-finance/out/$TS/caption.txt "beruang-finance/published/$TS/" 2>/dev/null || true
          cp beruang-finance/out/$TS/caption_reel.txt "beruang-finance/published/$TS/" 2>/dev/null || true
          cp beruang-finance/out/$TS/meta.json "beruang-finance/published/$TS/" 2>/dev/null || true
          ls -dt beruang-finance/published/*/ 2>/dev/null | tail -n +15 | xargs rm -rf 2>/dev/null || true
          python build_manifest.py || true   # update dashboard monitoring
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beruang-finance/published docs/faktaviral-manifest.json docs/beruang-manifest.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Beruang Finance $TS"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} || git rebase --abort
              sleep 2
            done
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish ke Instagram (@beruangfinance)
        if: ${{ github.event.inputs.post_mode != 'none' }}
        working-directory: fakta-poster
        run: |
          sleep 12   # beri waktu raw.githubusercontent serve file baru
          python publish_ig.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID_BF }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_BF }}
          POST_MODE: ${{ github.event.inputs.post_mode || steps.slot.outputs.mode }}
          PUB_DIR: ${{ github.workspace }}/beruang-finance/published/${{ env.TS }}
          RAW_DIR: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SHA }}/beruang-finance/published/${{ env.TS }}

      - name: Publish ke Facebook Page (Beruang)
        if: ${{ github.event.inputs.post_mode != 'none' }}
        continue-on-error: true
        working-directory: fakta-poster
        run: python publish_fb.py
        env:
          FB_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_BF }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_BF }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_BF }}
          POST_MODE: ${{ github.event.inputs.post_mode || steps.slot.outputs.mode }}
          PUB_DIR: ${{ github.workspace }}/beruang-finance/published/${{ env.TS }}
          RAW_DIR: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SHA }}/beruang-finance/published/${{ env.TS }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beruang-finance-${{ github.run_id }}
          path: beruang-finance/out/
          retention-days: 14
