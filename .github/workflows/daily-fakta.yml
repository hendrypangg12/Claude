name: Daily Fakta (semi-manual)

# Auto-generate 1 "fakta unik" carousel (original content, no copyright).
# Output is uploaded as an artifact you download + post manually.
# history.json is committed so facts don't repeat across runs.

on:
  schedule:
    # WIB = UTC+7. Two slots/day, rotating category for variety.
    - cron: "0 0 * * *"   # 07:00 WIB
    - cron: "0 12 * * *"  # 19:00 WIB
  workflow_dispatch:
    inputs:
      category:
        description: "Kategori (kosong = Claude pilih)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - sains
          - sejarah
          - tubuh
          - hewan
          - luarangkasa
          - teknologi

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fakta-poster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fakta-poster/requirements.txt

      - run: pip install -r requirements.txt

      - name: Resolve category for this run
        id: cat
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *")  echo "value=sains"   >> "$GITHUB_OUTPUT" ;;
            "0 12 * * *") echo "value=sejarah" >> "$GITHUB_OUTPUT" ;;
            *)            echo "value=${{ github.event.inputs.category }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: python daily_fakta.py
        env:
          DRY_RUN: "true"
          CATEGORY: ${{ steps.cat.outputs.value }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit history (dedup memory)
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fakta-poster/history.json
          if git diff --staged --quiet; then
            echo "No history change."
          else
            git commit -m "Fakta history $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload generated carousel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fakta-${{ github.run_id }}
          path: fakta-poster/out/
          retention-days: 14
