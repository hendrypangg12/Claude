name: Daily Fakta (semi-manual)

# Auto-generate 1 "fakta unik" carousel (original content, no copyright).
# Output is uploaded as an artifact you download + post manually.
# history.json is committed so facts don't repeat across runs.

on:
  schedule:
    # WIB = UTC+7. Two slots/day, rotating category for variety.
    - cron: "0 0 * * *"   # 07:00 WIB
    - cron: "0 12 * * *"  # 19:00 WIB
  workflow_dispatch:
    inputs:
      category:
        description: "Kategori (kosong = Claude pilih)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - sains
          - sejarah
          - tubuh
          - hewan
          - luarangkasa
          - teknologi
      post_mode:
        description: "Mau post apa?"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - reel
          - carousel

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fakta-poster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fakta-poster/requirements.txt

      - run: pip install -r requirements.txt

      - name: Install ffmpeg (untuk reel video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Resolve category for this run
        id: cat
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *")  echo "value=sains"   >> "$GITHUB_OUTPUT" ;;
            "0 12 * * *") echo "value=sejarah" >> "$GITHUB_OUTPUT" ;;
            *)            echo "value=${{ github.event.inputs.category }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: python daily_fakta.py
        env:
          DRY_RUN: "true"
          CATEGORY: ${{ steps.cat.outputs.value }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Siapkan media publik + commit
        working-directory: ${{ github.workspace }}
        run: |
          TS=$(ls -t fakta-poster/out | head -1)
          echo "TS=$TS" >> "$GITHUB_ENV"
          mkdir -p "fakta-poster/published/$TS"
          cp fakta-poster/out/$TS/post_*.jpg "fakta-poster/published/$TS/" 2>/dev/null || true
          cp fakta-poster/out/$TS/reel.mp4 "fakta-poster/published/$TS/" 2>/dev/null || true
          cp fakta-poster/out/$TS/caption.txt "fakta-poster/published/$TS/" 2>/dev/null || true
          cp fakta-poster/out/$TS/meta.json "fakta-poster/published/$TS/" 2>/dev/null || true
          # keep only the 14 most-recent published folders
          ls -dt fakta-poster/published/*/ 2>/dev/null | tail -n +15 | xargs rm -rf 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fakta-poster/published fakta-poster/history.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Fakta publish $TS"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish ke Instagram (carousel + reel)
        run: |
          sleep 12   # beri waktu raw.githubusercontent serve file baru
          python publish_ig.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_MODE: ${{ github.event.inputs.post_mode || 'both' }}
          PUB_DIR: published/${{ env.TS }}
          RAW_DIR: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SHA }}/fakta-poster/published/${{ env.TS }}

      - name: Upload generated carousel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fakta-${{ github.run_id }}
          path: fakta-poster/out/
          retention-days: 14
