name: Daily Fakta (semi-manual)

# Tiap PAGI cari 1 konten VIRAL terverifikasi (cek search engine: fresh + udah mulai rame)
# → di-commit ke dashboard buat di-REVIEW & post MANUAL. TIDAK auto-post (mode=none).
# Bisa juga di-Generate on-demand dari dashboard (pilih kategori + mau post atau preview).

# Antri sama beruang-finance (grup sama) → 2 workflow GAK jalan barengan = hindari rate limit Anthropic 429.
concurrency:
  group: ig-content-gen
  cancel-in-progress: false

on:
  # AUTO-POST faktaviral (berita trending) — carousel + reel, 3x/hari WIB.
  schedule:
    - cron: "9 23 * * *"  # 06:09 WIB → trending (auto-post carousel + reel)
    - cron: "9 0 * * *"   # 07:09 WIB → trending (auto-post carousel + reel)
    - cron: "0 3 * * *"   # 10:00 WIB → trending (auto-post carousel + reel)
  workflow_dispatch:
    inputs:
      category:
        description: "Kategori (kosong = Claude pilih). Bebas, mis. sains/sejarah/keuangan/aktor"
        required: false
        default: ""
        type: string
      topic:
        description: "Topik spesifik (opsional, mis. 'hiu lebih tua dari pohon'). Kosong = Claude pilih"
        required: false
        default: ""
        type: string
      post_mode:
        description: "Mau post apa? (auto harian = carousel; reel post manual + trending audio)"
        required: false
        default: "carousel"
        type: choice
        options:
          - carousel
          - reel
          - both
          - none

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fakta-poster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fakta-poster/requirements.txt

      - run: pip install -r requirements.txt

      - name: Install ffmpeg (untuk reel video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Resolve slot (kategori + mode) untuk run ini
        id: slot
        run: |
          # PAGI (terjadwal) → cari konten 'trending' viral, AUTO-POST carousel + reel
          case "${{ github.event.schedule }}" in
            "9 23 * * *"|"9 0 * * *"|"0 3 * * *") cat="trending"; mode="both" ;;  # 06:09 / 07:09 / 10:00 WIB
            *)            cat="${{ github.event.inputs.category }}"; mode="" ;;  # manual (dashboard)
          esac
          echo "cat=$cat"   >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - run: python daily_fakta.py
        env:
          DRY_RUN: "true"
          CATEGORY: ${{ steps.slot.outputs.cat }}
          TOPIC: ${{ github.event.inputs.topic }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      - name: Siapkan media publik + commit
        # selalu commit (biar muncul di dashboard utk preview); publish-nya yg digate post_mode
        working-directory: ${{ github.workspace }}
        run: |
          TS=$(ls -t fakta-poster/out | head -1)
          echo "TS=$TS" >> "$GITHUB_ENV"
          mkdir -p "fakta-poster/published/$TS"
          cp fakta-poster/out/$TS/post_*.jpg "fakta-poster/published/$TS/" 2>/dev/null || true
          # reel: skip kalau >99MB (limit GitHub 100MB) — carousel tetap ke-commit
          REEL="fakta-poster/out/$TS/reel.mp4"
          if [ -f "$REEL" ] && [ "$(stat -c%s "$REEL")" -lt 99000000 ]; then
            cp "$REEL" "fakta-poster/published/$TS/"
          else
            echo "reel skip (kegedean/ga ada)"
          fi
          cp fakta-poster/out/$TS/caption.txt "fakta-poster/published/$TS/" 2>/dev/null || true
          cp fakta-poster/out/$TS/caption_reel.txt "fakta-poster/published/$TS/" 2>/dev/null || true
          cp fakta-poster/out/$TS/meta.json "fakta-poster/published/$TS/" 2>/dev/null || true
          # keep only the 14 most-recent published folders
          ls -dt fakta-poster/published/*/ 2>/dev/null | tail -n +15 | xargs rm -rf 2>/dev/null || true
          python build_manifest.py || true   # update dashboard monitoring
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fakta-poster docs   # -A: ikut history.json dll → working tree bersih (rebase aman)
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Fakta publish $TS"
            # branch bisa udah maju (push lain barengan) → sync dulu, retry (--autostash anti 'unstaged changes')
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              echo "push ditolak, sync ulang ($i)..."
              git fetch origin ${{ github.ref_name }}
              git rebase --autostash origin/${{ github.ref_name }} || git rebase --abort
              sleep 3
            done
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish ke Instagram (carousel + reel)
        if: ${{ (github.event.inputs.post_mode || steps.slot.outputs.mode) != 'none' }}
        run: |
          sleep 12   # beri waktu raw.githubusercontent serve file baru
          python publish_ig.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
          POST_MODE: ${{ github.event.inputs.post_mode || steps.slot.outputs.mode }}
          PUB_DIR: published/${{ env.TS }}
          RAW_DIR: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SHA }}/fakta-poster/published/${{ env.TS }}

      - name: Publish ke Facebook Page
        if: ${{ (github.event.inputs.post_mode || steps.slot.outputs.mode) != 'none' }}
        continue-on-error: true   # FB sekunder — kalau token belum siap, IG tetap jalan
        run: python publish_fb.py
        env:
          FB_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POST_MODE: ${{ github.event.inputs.post_mode || steps.slot.outputs.mode }}
          PUB_DIR: published/${{ env.TS }}
          RAW_DIR: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SHA }}/fakta-poster/published/${{ env.TS }}

      - name: Upload generated carousel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fakta-${{ github.run_id }}
          path: fakta-poster/out/
          retention-days: 14
