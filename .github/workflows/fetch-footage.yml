name: Fetch Footage (Pexels)

# Ambil klip + foto stock dari Pexels untuk 1 topik, commit ke repo.
# Dipakai buat render reel/carousel pakai overlay custom (data terverifikasi).

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Subjek (pisah koma, mis. 'rupiah money,stock market chart,bank building')"
        required: true
        default: "indonesian rupiah money,stock market chart,bank building"
        type: string
      slug:
        description: "Nama folder output (kosong = auto dari query pertama)"
        required: false
        default: ""
        type: string
      per:
        description: "Kalau cuma 1 subjek, ambil berapa klip"
        required: false
        default: "3"
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fakta-poster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fakta-poster/requirements.txt

      - run: pip install -r requirements.txt

      - name: Fetch dari Pexels
        run: python fetch_footage.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          QUERIES: ${{ github.event.inputs.queries }}
          OUT_DIR: ${{ github.event.inputs.slug != '' && format('footage/{0}', github.event.inputs.slug) || '' }}
          PER: ${{ github.event.inputs.per }}

      - name: Commit footage
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fakta-poster/footage
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Footage Pexels ${{ github.event.inputs.queries }}"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              echo "push ditolak, sync ulang ($i)..."
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} || git rebase --abort
              sleep 2
            done
          fi
