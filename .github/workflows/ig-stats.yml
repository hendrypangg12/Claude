name: IG Stats (monitor)

# Ambil statistik IG (foto profil, post, follower, following) → docs/ig-stats.json.
# Dibaca dashboard monitor. Gratis (cuma Graph API), tanpa Anthropic.

on:
  schedule:
    - cron: "5 */6 * * *"   # tiap 6 jam
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fakta-poster/ig_stats.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USER_ID_BF: ${{ secrets.IG_USER_ID_BF }}
          IG_USER_ID_SK: ${{ secrets.IG_USER_ID_SK }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_BF: ${{ secrets.IG_ACCESS_TOKEN_BF }}
      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ig-stats.json
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "IG stats update"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git fetch origin ${{ github.ref_name }}; git rebase --autostash origin/${{ github.ref_name }} || git rebase --abort; sleep 3
            done
          fi
