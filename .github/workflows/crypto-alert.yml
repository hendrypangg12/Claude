name: Crypto Pump Alert

# Scan semua pair USDT di MEXC (harga) yang ada di Binance Futures (listing/funding),
# deteksi kenaikan >= threshold dalam WINDOW_MINUTES terakhir, kirim alert ke Telegram.
# Gratis. Lihat crypto-alert/README.md buat setup.
#
# Jadwal PRESISI (tiap 2 menit) dipicu dari LUAR (cron-job.org → workflow_dispatch),
# karena cron bawaan GitHub gak reliable buat interval sesering ini (suka di-throttle
# jadi ~1x/jam). Schedule cron di bawah cuma fallback/safety-net (1x/jam) kalau-kalau
# trigger eksternalnya mati.

concurrency:
  group: crypto-pump-alert
  cancel-in-progress: false

on:
  schedule:
    - cron: "7 * * * *"  # fallback 1x/jam — trigger utama dari cron-job.org
  workflow_dispatch:
    inputs:
      pump_threshold_pct:
        description: "Ambang pump (%) buat trigger alert"
        required: false
        default: "8"
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: crypto-alert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crypto-alert/requirements.txt

      - run: pip install -r requirements.txt

      - run: python pump_scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUMP_THRESHOLD_PCT: ${{ github.event.inputs.pump_threshold_pct || '8' }}

      - name: Commit history (heartbeat tiap run + alert baru)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f history.json ] && git add history.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Crypto pump alert $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git fetch origin ${{ github.ref_name }}
              git rebase --autostash origin/${{ github.ref_name }} || git rebase --abort
              sleep 3
            done
          fi
