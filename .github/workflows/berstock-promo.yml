name: Berstock promo BerUang (post ke @berstock.id)

# Posting 1 desain promo app BerUang yang udah ada di berstock-promo/published/<id> ke IG @berstock.id.
# Gak generate apa-apa. Pilih post-nya dari dropdown, tap Run.
# Butuh Secret: IG_USER_ID_BS (IG User ID @berstock.id). Token: IG_ACCESS_TOKEN_BS kalau ada, else IG_ACCESS_TOKEN.

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Post mana? (urutan posting: 06 dulu → 01 terakhir)"
        required: true
        type: choice
        options:
          - 06_download
          - 05_hutang-piutang
          - 04_catat-cek-beruang
          - 03_dashboard
          - 02_foto-struk
          - 01_catat-via-chat

concurrency:
  group: ig-content-gen
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fakta-poster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fakta-poster/requirements.txt
      - run: pip install -r requirements.txt

      - name: Cek secret
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID_BS }}
        run: |
          if [ -z "$IG_USER_ID" ]; then
            echo "::error::Secret IG_USER_ID_BS belum di-set (IG User ID @berstock.id)."
            exit 1
          fi

      - name: Publish ke Instagram (@berstock.id)
        run: python publish_ig.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID_BS }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_BS || secrets.IG_ACCESS_TOKEN }}
          POST_MODE: carousel
          POST_STORY: "false"
          PUB_DIR: ${{ github.workspace }}/berstock-promo/published/${{ github.event.inputs.id }}
          RAW_DIR: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/berstock-promo/published/${{ github.event.inputs.id }}
