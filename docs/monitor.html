<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor Auto-Post</title>
<style>
  :root{ --bg:#0d0f14; --card:#161a22; --line:#242a35; --txt:#e9edf5; --mut:#8a93a3;
         --ok:#22c55e; --bad:#ef4444; --run:#f5b301; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:640px;margin:auto}
  h1{font-size:20px;margin:6px 0 2px} .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .bar{display:flex;gap:8px;margin-bottom:14px}
  button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
  button.ghost{background:var(--card);border:1px solid var(--line);color:var(--txt)}
  input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:14px}
  .acct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .acct h2{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center}
  .tag{font-size:11px;color:var(--mut);font-weight:500}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);
       font-size:14px;color:var(--txt);text-decoration:none}
  .row:first-of-type{border-top:0}
  .t{flex:1} .t small{color:var(--mut);font-size:12px}
  .st{font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .run{color:var(--run)}
  .msg{color:var(--mut);font-size:13px;padding:6px 0}
  a{color:#60a5fa;text-decoration:none}
</style>
</head>
<body>
  <h1>📡 Monitor Auto-Post</h1>
  <div class="sub">✅ = kepost · ❌ = gagal · ⏳ = lagi proses · waktu WIB</div>
  <div class="bar">
    <button onclick="loadAll()">🔄 Refresh</button>
    <button class="ghost" onclick="location.href='dashboard.html'">⚙️ Dashboard</button>
  </div>
  <div id="need" style="display:none">
    <div class="msg">Belum ada token GitHub. Tempel di sini (sekali aja):</div>
    <div class="bar"><input id="patIn" placeholder="ghp_..." /><button onclick="saveTok()">Simpan</button></div>
  </div>
  <div id="out"></div>

<script>
const OWNER="hendrypangg12", REPO="Claude";
const ACCTS=[
  {name:"🔵 Fakta Viral", wf:"daily-fakta.yml"},
  {name:"🟡 Beruang Finance", wf:"beruang-finance.yml"},
  {name:"⚫ Story Kantor", wf:"story-kantor.yml"},
];
const pat=()=>localStorage.getItem("gh_pat")||"";
function saveTok(){ const v=document.getElementById("patIn").value.trim();
  if(v){ localStorage.setItem("gh_pat",v); loadAll(); } }
const H=()=>({Authorization:`Bearer ${pat()}`,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});

function jam(iso){ return new Date(iso).toLocaleTimeString("id-ID",{timeZone:"Asia/Jakarta",
  hour:"2-digit",minute:"2-digit"}); }
function tgl(iso){ return new Date(iso).toLocaleDateString("id-ID",{timeZone:"Asia/Jakarta",
  day:"2-digit",month:"short"}); }

function statusOf(r){
  if(r.status!=="completed") return {ic:"⏳",cls:"run",tx:"proses"};
  if(r.conclusion==="success") return {ic:"✅",cls:"ok",tx:"kepost"};
  return {ic:"❌",cls:"bad",tx:r.conclusion||"gagal"};
}

async function loadAcct(a){
  const url=`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${a.wf}/runs?per_page=8`;
  let runs=[];
  try{ const r=await fetch(url,{headers:H()}); const j=await r.json(); runs=j.workflow_runs||[]; }
  catch(e){ return `<div class="acct"><h2>${a.name}</h2><div class="msg">error: ${e.message}</div></div>`; }
  // hitung "kepost hari ini"
  const today=new Date().toLocaleDateString("id-ID",{timeZone:"Asia/Jakarta"});
  const okToday=runs.filter(r=>r.conclusion==="success" &&
    new Date(r.created_at).toLocaleDateString("id-ID",{timeZone:"Asia/Jakarta"})===today).length;
  const rows=runs.slice(0,7).map(r=>{ const s=statusOf(r);
    return `<a class="row" href="${r.html_url}" target="_blank">
      <div class="t"><b>jam ${jam(r.created_at)}</b> <small>${tgl(r.created_at)} · ${r.event==="schedule"?"otomatis":"manual"}</small></div>
      <div class="st ${s.cls}">${s.ic} ${s.tx}</div></a>`; }).join("");
  return `<div class="acct"><h2>${a.name}<span class="tag">✅ ${okToday} kepost hari ini</span></h2>
    ${rows||'<div class="msg">belum ada run</div>'}</div>`;
}

async function loadAll(){
  if(!pat()){ document.getElementById("need").style.display="block"; return; }
  document.getElementById("need").style.display="none";
  document.getElementById("out").innerHTML='<div class="msg">Memuat…</div>';
  const html=await Promise.all(ACCTS.map(loadAcct));
  document.getElementById("out").innerHTML=html.join("");
}
loadAll();
setInterval(loadAll, 60000);  // auto-refresh tiap 1 menit
</script>
</body>
</html>
