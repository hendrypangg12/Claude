<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypto Pump Alert — Monitor</title>
<style>
  :root{ --bg:#0d0f14; --card:#161a22; --line:#242a35; --txt:#e9edf5; --mut:#8a93a3;
         --ok:#22c55e; --bad:#ef4444; --warn:#f5b301; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:640px;margin:auto}
  h1{font-size:20px;margin:6px 0 2px} .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .bar{display:flex;gap:8px;margin-bottom:14px}
  button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:14px}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .sym{font-size:16px;font-weight:700;flex:1}
  .pct{font-size:16px;font-weight:700;color:var(--ok)}
  .time{color:var(--mut);font-size:12px}
  .risk{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;display:inline-block;margin-bottom:8px}
  .risk.high{background:#3a1414;color:var(--bad)}
  .risk.medium{background:#3a2f0a;color:var(--warn)}
  .risk.moderate{background:#1a2a1a;color:var(--ok)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:var(--txt)}
  .grid b{color:var(--mut);font-weight:500}
  .foot{margin-top:8px;font-size:12px;color:var(--mut)}
  a{color:#60a5fa;text-decoration:none}
  .empty{color:var(--mut);font-size:14px;text-align:center;padding:40px 0}
  .note{color:var(--mut);font-size:11px;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
  <h1>🚀 Crypto Pump Alert</h1>
  <div class="sub" id="clock">Riwayat alert pump ≥ threshold (short candidate). Update tiap 5 menit.</div>
  <div class="bar"><button onclick="load()">🔄 Refresh</button></div>
  <div id="out"><div class="empty">Loading...</div></div>
  <div class="note">SL/TP dari swing high/low + Fibonacci retracement, BUKAN Smart Money Concept (SMC) beneran, dan BUKAN saran finansial. Selalu pake risk management sendiri.</div>

<script>
const RAW = "https://raw.githubusercontent.com/hendrypangg12/Claude/claude/halo-bYUsl/crypto-alert/history.json";

function jam(iso){ return new Date(iso).toLocaleString("id-ID",{timeZone:"Asia/Jakarta",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+" WIB"; }
function fmtPrice(p){ p = Number(p); let s = p < 1 ? p.toFixed(8) : p.toLocaleString("en-US",{maximumFractionDigits:4}); return s.replace(/0+$/,"").replace(/\.$/,""); }
function riskClass(risk){
  if(!risk) return "moderate";
  if(risk.includes("HIGH")) return "high";
  if(risk.includes("MEDIUM")) return "medium";
  return "moderate";
}

async function load(){
  document.getElementById("out").innerHTML = '<div class="empty">Loading...</div>';
  try{
    const res = await fetch(RAW + "?t=" + Date.now());
    if(res.status === 404){
      document.getElementById("out").innerHTML = '<div class="empty">Belum ada alert yang tercatat. Nunggu pump pertama ≥ threshold.</div>';
      return;
    }
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const alerts = (data.alerts || []).slice().reverse();
    if(!alerts.length){
      document.getElementById("out").innerHTML = '<div class="empty">Belum ada alert. Nunggu pump ≥ threshold.</div>';
      return;
    }
    document.getElementById("out").innerHTML = alerts.map(a => {
      const url = "https://www.mexc.com/exchange/" + a.symbol.replace("USDT","_USDT");
      const fr = (a.funding_rate === null || a.funding_rate === undefined) ? "-" : a.funding_rate.toFixed(4) + "%";
      return `<div class="card">
        <div class="row"><span class="sym">${a.symbol}</span><span class="pct">+${a.pct}%</span></div>
        <div class="risk ${riskClass(a.risk)}">${a.risk || ""}</div>
        <div class="grid">
          <div><b>Entry</b> ${fmtPrice(a.price)}</div>
          <div><b>SL</b> ${fmtPrice(a.sl)}</div>
          <div><b>TP1</b> ${fmtPrice(a.tp1)}</div>
          <div><b>TP2</b> ${fmtPrice(a.tp2)}</div>
          <div><b>TP3</b> ${fmtPrice(a.tp3)}</div>
          <div><b>Funding</b> ${fr}</div>
        </div>
        <div class="foot">${jam(a.time)} · Vol 24h $${Number(a.quote_volume).toLocaleString("en-US",{maximumFractionDigits:0})} · <a href="${url}" target="_blank">MEXC ↗</a></div>
      </div>`;
    }).join("");
  }catch(e){
    document.getElementById("out").innerHTML = '<div class="empty">Gagal load data: '+e+'</div>';
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
