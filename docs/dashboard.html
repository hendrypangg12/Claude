<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1c">
<title>Content Monitor — Fakta Viral & Beruang</title>
<style>
  :root{ --bg:#0d0b1c; --card:#16142b; --line:#272447; --txt:#f4f6fb; --muted:#a4a2c4; --accent:#22d3ee; --ink:#08121a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  header{ position:sticky; top:0; z-index:5; background:rgba(13,11,28,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 16px calc(14px + env(safe-area-inset-top)); padding-top:max(14px,env(safe-area-inset-top)); }
  .brandrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .logo{ font-weight:900; font-size:18px; letter-spacing:.5px; }
  .logo b{ color:var(--accent); }
  .refresh{ background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:8px 12px; font-weight:700; font-size:13px; }
  .tabs{ display:flex; gap:8px; margin-top:12px; }
  .tab{ flex:1; text-align:center; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-weight:800; font-size:14px; }
  .tab.active{ background:var(--accent); color:var(--ink); border-color:var(--accent); }
  .status{ color:var(--muted); font-size:12px; margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; }
  main{ padding:14px 14px 40px; max-width:760px; margin:0 auto; }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; }
  .thumb{ position:relative; aspect-ratio:1/1; background:#0a0918; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .badges{ position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; gap:6px; }
  .chip{ background:var(--accent); color:var(--ink); font-size:10px; font-weight:900; letter-spacing:.5px; padding:4px 8px; border-radius:7px; }
  .chip.dark{ background:rgba(8,12,24,.78); color:var(--accent); }
  .meta{ padding:10px 11px 12px; }
  .meta .t{ font-size:13px; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .meta .d{ color:var(--muted); font-size:11px; margin-top:7px; }
  .empty,.loading{ color:var(--muted); text-align:center; padding:50px 20px; font-size:14px; }
  /* modal */
  .ov{ position:fixed; inset:0; background:rgba(5,4,12,.96); z-index:20; display:none; flex-direction:column; }
  .ov.open{ display:flex; }
  .ovhead{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; padding-top:max(14px,env(safe-area-inset-top)); border-bottom:1px solid var(--line); }
  .ovhead .x{ background:var(--card); border:1px solid var(--line); color:var(--txt); width:36px; height:36px; border-radius:50%; font-size:18px; font-weight:800; }
  .ovhead .ti{ font-size:13px; color:var(--muted); font-weight:700; }
  .ovbody{ overflow-y:auto; padding:14px 14px 40px; max-width:620px; margin:0 auto; width:100%; }
  .slides{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; }
  .slides img,.slides video{ width:84%; flex:0 0 84%; scroll-snap-align:center; border-radius:14px; background:#0a0918; }
  .h2{ font-size:18px; font-weight:800; margin:16px 2px 6px; line-height:1.3; }
  .sub{ color:var(--muted); font-size:12px; margin:0 2px 12px; }
  .cap{ white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; font-size:13.5px; line-height:1.5; }
  .btnrow{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .btn{ flex:1; min-width:140px; text-align:center; background:var(--accent); color:var(--ink); border:none; border-radius:12px; padding:13px; font-weight:800; font-size:14px; text-decoration:none; }
  .btn.ghost{ background:var(--card); color:var(--txt); border:1px solid var(--line); }
  .toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--accent); color:var(--ink); font-weight:800; padding:11px 18px; border-radius:12px; font-size:13px; opacity:0; transition:opacity .2s; z-index:30; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <div class="logo">📡 Content <b>Monitor</b></div>
    <button class="refresh" onclick="load(true)">↻ Refresh</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-brand="faktaviral" onclick="setTab('faktaviral')">🪐 Fakta Viral</div>
    <div class="tab" data-brand="beruang" onclick="setTab('beruang')">🐻 Beruang Finance</div>
  </div>
  <div class="status" id="status"><span class="dot"></span> memuat…</div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="loading" id="loading">Memuat konten…</div>
</main>

<div class="ov" id="ov">
  <div class="ovhead">
    <button class="x" onclick="closeOv()">✕</button>
    <div class="ti" id="ovti"></div>
    <div style="width:36px"></div>
  </div>
  <div class="ovbody" id="ovbody"></div>
</div>
<div class="toast" id="toast">Tersalin ✓</div>

<script>
const REPO_OWNER="hendrypangg12", REPO_NAME="Claude", BRANCH="claude/halo-bYUsl";
const RAW=`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}`;
const BRANDS={
  faktaviral:{ base:`${RAW}/fakta-poster/published`, manifest:`${RAW}/docs/faktaviral-manifest.json`, accent:"#22d3ee", ink:"#08121a" },
  beruang:{ base:`${RAW}/beruang-finance/published`, manifest:`${RAW}/docs/beruang-manifest.json`, accent:"#ffc107", ink:"#3a2616" },
};
let brand="faktaviral", cache={};

function setTab(b){
  brand=b;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.brand===b));
  const c=BRANDS[b]; document.documentElement.style.setProperty("--accent",c.accent); document.documentElement.style.setProperty("--ink",c.ink);
  document.querySelector('meta[name=theme-color]').setAttribute("content","#0d0b1c");
  render();
}
async function load(force){
  const c=BRANDS[brand];
  document.getElementById("loading").style.display="block";
  document.getElementById("grid").innerHTML="";
  try{
    const r=await fetch(c.manifest+"?_="+Date.now());
    cache[brand]=await r.json();
  }catch(e){ cache[brand]={posts:[]}; }
  render();
}
function render(){
  const c=BRANDS[brand], data=cache[brand];
  const grid=document.getElementById("grid"), load=document.getElementById("loading");
  if(!data){ load.style.display="block"; return; }
  const posts=(data.posts||[]);
  load.style.display="none";
  const last=posts[0];
  document.getElementById("status").innerHTML=`<span class="dot"></span> ${posts.length} post · update terakhir: ${last?(last.date+" "+last.time):"—"}`;
  if(!posts.length){ grid.innerHTML='<div class="empty" style="grid-column:1/-1">Belum ada konten. Tunggu jadwal otomatis atau Run workflow.</div>'; return; }
  grid.innerHTML=posts.map(p=>`
    <div class="card" onclick='openPost(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
      <div class="thumb">
        <img loading="lazy" src="${c.base}/${p.id}/post_1.jpg" onerror="this.style.opacity=.2">
        <div class="badges">
          <span class="chip">${p.label||"POST"}</span>
          <span class="chip dark">${p.reel?"🎬 Reel":"🖼️ "+p.slides}</span>
        </div>
      </div>
      <div class="meta"><div class="t">${esc(p.title)}</div><div class="d">${p.date} · ${p.time}</div></div>
    </div>`).join("");
}
async function openPost(p){
  const c=BRANDS[brand], body=document.getElementById("ovbody");
  document.getElementById("ovti").textContent=`${p.label||""} · ${p.date} ${p.time}`;
  let slides="";
  for(let i=1;i<=p.slides;i++) slides+=`<img src="${c.base}/${p.id}/post_${i}.jpg">`;
  if(p.reel) slides+=`<video src="${c.base}/${p.id}/reel.mp4" controls playsinline></video>`;
  body.innerHTML=`
    <div class="slides">${slides}</div>
    <div class="h2">${esc(p.title)}</div>
    <div class="sub">${p.slides} slide${p.reel?" + reel berlagu":""} · ${p.date} ${p.time}</div>
    <div class="cap" id="capbox">memuat caption…</div>
    <div class="btnrow">
      <button class="btn" onclick="copyCap()">📋 Salin caption</button>
      ${p.reel?'<button class="btn ghost" onclick="copyCap(true)">📋 Caption reel (+kredit)</button>':''}
    </div>
    <div class="btnrow">
      <a class="btn ghost" href="${c.base}/${p.id}/post_1.jpg" download>⬇️ Slide 1</a>
      ${p.reel?`<a class="btn ghost" href="${c.base}/${p.id}/reel.mp4" download>⬇️ Reel</a>`:''}
    </div>`;
  document.getElementById("ov").classList.add("open");
  window._cur={c,p,cap:"",capReel:""};
  fetchCap(false); if(p.reel) fetchCap(true);
}
async function fetchCap(reel){
  const {c,p}=window._cur;
  const file=reel?"caption_reel.txt":"caption.txt";
  try{ const r=await fetch(`${c.base}/${p.id}/${file}?_=`+Date.now()); const t=await r.text();
    if(reel) window._cur.capReel=t; else { window._cur.cap=t; document.getElementById("capbox").textContent=t; }
  }catch(e){ if(!reel) document.getElementById("capbox").textContent="(caption tidak tersedia)"; }
}
function copyCap(reel){
  const t=reel?(window._cur.capReel||window._cur.cap):window._cur.cap;
  navigator.clipboard.writeText(t||"").then(()=>toast());
}
function closeOv(){ document.getElementById("ov").classList.remove("open"); }
function toast(){ const t=document.getElementById("toast"); t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1300); }
function esc(s){ return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
document.getElementById("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeOv(); });
setTab("faktaviral"); load();
</script>
</body>
</html>
